name: Release

# Baut bei jedem Tag (v*) den Windows-Installer und hängt ihn an das Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Der Tag ist die Quelle der Version: v1.2.0 -> 1.2.0 im Artefaktnamen.
      - name: Version aus dem Tag setzen
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Installer bauen
        run: npm run dist:installer -- --publish never
        env:
          # Ohne Zertifikat bauen; verhindert Signierversuche auf dem Runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Release anlegen oder ergänzen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist/*.exe || true
          # Nur der Installer, nicht der interne NSIS-Hilfsinstaller.
          ARTIFACT="dist/AfD-Dossier-${TAG#v}.exe"
          if [ ! -f "$ARTIFACT" ]; then
            echo "Artefakt fehlt: $ARTIFACT"
            ls -l dist
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --title "AfD-Dossier ${TAG#v} (Windows)" \
                 --generate-notes
          gh release upload "$TAG" "$ARTIFACT" --clobber
