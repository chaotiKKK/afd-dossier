<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';" />
  <title>AfD-Check</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="head">
    <div class="head-row">
      <h1>AfD-Check</h1>
      <span class="stand">Stand <span id="stand"></span></span>
    </div>
    <div class="controls">
      <label class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Behauptung, Begriff oder Quelle suchen"
               autocomplete="off" spellcheck="false" aria-label="Einträge durchsuchen" />
      </label>
      <div class="chips" id="chips" role="group" aria-label="Nach Kategorie filtern"></div>
    </div>
  </header>

  <main>
    <p class="intro" id="intro"></p>
    <div id="list" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <h2>Wie die vier Kategorien gemeint sind</h2>
    <dl id="legend"></dl>
    <p class="foot-note">
      Alle Quellen sind verlinkt, datiert und im Systembrowser prüfbar. Die App arbeitet offline und
      lädt keine Inhalte nach. Bewertungen sind als Einordnung gekennzeichnet, nicht als Tatsache.
    </p>
  </footer>

  <script src="data/entries.js"></script>
  <script src="app.js"></script>
</body>
</html>
